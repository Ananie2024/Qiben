server:
  port: 8080
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/qiben}
    username: ${SPRING_DATASOURCE_USERNAME:qiben}
    password: ${SPRING_DATASOURCE_PASSWORD:qiben-dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  servlet.multipart.max-file-size: 8MB
  servlet.multipart.max-request-size: 10MB
qiben:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  site-url: ${SITE_URL:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  jwt-secret: ${JWT_SECRET:}
  cookie-secure: ${COOKIE_SECURE:false}
  media-root: ${MEDIA_ROOT:./media}
  inbox: ${QIBEN_INBOX:hello@example.com}
springdoc.swagger-ui.path: /swagger-ui.html
