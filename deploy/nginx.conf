server {
  listen 80;
  server_name qiben.example www.qiben.example;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name qiben.example www.qiben.example;
  ssl_certificate /etc/letsencrypt/live/qiben.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/qiben.example/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location ^~ /admin { add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:8088; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  location /api/ { proxy_pass http://127.0.0.1:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Real-IP $remote_addr; }
  location / { proxy_pass http://127.0.0.1:8088; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
